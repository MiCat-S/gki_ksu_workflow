name: Check Reviewed Stack Updates

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel Version to Check'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - '6.1'
          - '6.6'
          - '6.12'
  workflow_call:
    inputs:
      kernel_version:
        required: false
        type: string
        default: 'all'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report upstream candidates without changing the reviewed stack
        env:
          KERNEL_VERSION_TO_CHECK: ${{ inputs.kernel_version || 'all' }}
        run: python3 .github/scripts/check-stack-updates.py

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stack-update-report
          path: stack-updates.json
